<div class="col-md-6 col-lg-4"><article class="card h-100"><div class="campaign-top {{ campaign.disaster_type }}"><span class="badge bg-white text-dark">{{ campaign.get_disaster_type_display }} relief</span></div><div class="card-body"><p class="small muted">⌖ {{ campaign.district }} · {{ campaign.upazila }}</p><h4 class="fw-bold">{{ campaign.name }}</h4><p class="muted">{{ campaign.description|truncatewords:22 }}</p><div class="progress my-3" role="progressbar" aria-label="Campaign progress" aria-valuenow="{{ campaign.progress }}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:{{ campaign.progress }}%"></div></div><div class="d-flex justify-content-between small"><strong>৳{{ campaign.collected_amount|floatformat:0 }}</strong><span class="muted">of ৳{{ campaign.target_amount|floatformat:0 }}</span></div><a class="btn btn-outline-success w-100 mt-4" href="{% url 'campaigns:detail' campaign.pk %}">Explore campaign ↗</a></div></article></div>
